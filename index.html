<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NikyCRM</title>
<link rel="manifest" href="./manifest.json"/>
<link rel="apple-touch-icon" href="./icon-192.png"/>
<link rel="icon" type="image/png" href="./icon-192.png"/>
<meta name="theme-color" content="#6366f1"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e8ecf4;--muted:#6b7280;--accent:#6366f1;--green:#10b981;--yellow:#f59e0b;--red:#ef4444}
.light{--bg:#f4f6fb;--surface:#ffffff;--border:#e2e8f0;--text:#1a1d27;--muted:#64748b}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit;outline:none;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:14px;width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical}
#app{display:flex;flex-direction:column;min-height:100dvh}
header{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:16px}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center}
.nav-desktop{display:flex;gap:4px}
@media(max-width:600px){.nav-desktop{display:none}}
.nav-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;transition:.15s}
.nav-btn.active{background:var(--accent);color:#fff}
.nav-btn:not(.active){color:var(--muted)}
.nav-btn:not(.active):hover{background:var(--border)}
main{flex:1;max-width:900px;width:100%;margin:0 auto;padding:20px 16px 90px}
@media(min-width:600px){main{padding-bottom:24px}}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:40}
@media(min-width:600px){.bottom-nav{display:none}}
.bottom-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.bottom-btn.active{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:600px){.grid3{grid-template-columns:1fr 1fr}.grid5{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;transition:.15s;cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:#ef444420;border:1px solid #ef444440;color:#ef4444}
.btn-green{background:#10b98120;border:1px solid #10b98140;color:#10b981}
.btn-yellow{background:#f59e0b20;border:1px solid #f59e0b40;color:#f59e0b}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;font-size:11px;font-weight:700;padding:2px 8px;white-space:nowrap}
.badge-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;width:100%;max-width:560px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.5)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-body{padding:20px;overflow-y:auto;max-height:82vh}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.client-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
.client-row:hover{border-color:var(--accent);transform:translateY(-1px)}
.client-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex-shrink:0}
/* project card */
.proj-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;transition:.15s}
.proj-card:hover{border-color:var(--accent)}
.proj-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer}
.proj-body{padding:0 16px 16px;border-top:1px solid var(--border)}
.tl-item{display:flex;gap:12px;align-items:flex-start}
.tl-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.pipeline-col{border-radius:12px;padding:12px;text-align:center}
.pill{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:.15s;white-space:nowrap}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill:hover:not(.active){border-color:var(--accent);color:var(--accent)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input{width:70px;text-align:center}
.stepper-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:.15s}
.stepper-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.prog-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:6px}
.prog-fill{height:100%;border-radius:3px;transition:.3s}
.toggle-wrap{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.toggle{width:40px;height:22px;border-radius:11px;background:var(--border);position:relative;transition:.2s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.toggle.on::after{left:21px}
.split-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
.split-row:last-child{border-bottom:none}
.pay-mini{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;font-size:13px;gap:8px}
/* section label */
.sec-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
/* utils */
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap1{gap:4px}.gap2{gap:8px}.gap3{gap:12px}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}
.mb1{margin-bottom:4px}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}
.space-y-2>*+*{margin-top:8px}.space-y-3>*+*{margin-top:12px}.space-y-4>*+*{margin-top:16px}
.text-xs{font-size:11px}.text-sm{font-size:13px}.text-lg{font-size:18px}.text-xl{font-size:21px}.text-2xl{font-size:26px}.text-3xl{font-size:32px}
.font-bold{font-weight:700}.font-black{font-weight:900}
.muted{color:var(--muted)}.accent{color:var(--accent)}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upper{text-transform:uppercase;letter-spacing:.06em}
.w-full{width:100%}
.chevron{transition:transform .2s;display:inline-block}
.chevron.open{transform:rotate(90deg)}
</style>
</head>
<body><div id="app"></div>
<script>
// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const STAGES=["Da contattare","Preventivo inviato","In attesa","In lavorazione","Completato"];
const SC={"Da contattare":"#6366f1","Preventivo inviato":"#f59e0b","In attesa":"#ef4444","In lavorazione":"#10b981","Completato":"#64748b"};
const SERVICES=["Montaggio Podcast","Podcasting Flow","Consulenza","Altro"];
const PC={"Non pagato":"#ef4444","Parziale":"#f59e0b","Pagato":"#10b981"};
const PROJ_STAGES=["Pianificato","In corso","Completato","Annullato"];
const PSC={"Pianificato":"#6366f1","In corso":"#10b981","Completato":"#64748b","Annullato":"#ef4444"};
// stato del singolo pagamento registrato
const PAY_STATUS=["Pagato","Fattura da emettere","In attesa"];
const PAY_STATUS_C={"Pagato":"#10b981","Fattura da emettere":"#f59e0b","In attesa":"#6366f1"};

// ─── STORAGE ──────────────────────────────────────────────────────────────────
const LS={
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const S={
  clients: LS.get("crm_clients",[]),
  events:  LS.get("crm_events",[]),
  payments:LS.get("crm_payments",[]),
  projects:LS.get("crm_projects",[]),
  settings:LS.get("crm_settings",{businessName:"NikyCRM",alertDays:7,splits:{Tasse:25,"Fondo emergenza":10,Reinvestimento:15,Disponibile:50}}),
  dark:LS.get("crm_dark",true),
  page:"dashboard", selClient:null, selProject:null,
  openProjects:{}, // which project cards are expanded
  openSections:{}  // sezioni progetti completati / archiviati aperte
};
// il nome dell'app è NikyCRM (vecchi nomi salvati vengono aggiornati)
function normSettings(){if(!S.settings.businessName||["DomePodcast","Niky CRM"].includes(S.settings.businessName))S.settings.businessName="NikyCRM";delete S.settings.ghToken;}
normSettings();
// sync GitHub: token e repo restano solo su questo dispositivo (mai nei backup)
const SYNC=LS.get("crm_sync",{token:"",gist:""});
function save(){
  LS.set("crm_clients",S.clients);LS.set("crm_events",S.events);
  LS.set("crm_payments",S.payments);LS.set("crm_projects",S.projects);
  LS.set("crm_settings",S.settings);LS.set("crm_dark",S.dark);
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
const uid=()=>crypto.randomUUID?.()??Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().split("T")[0];
const fmt=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(n||0);
const fmtD=d=>d?new Date(d).toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"}):"—";
const daysSince=d=>d?Math.floor((Date.now()-new Date(d).getTime())/86400000):999;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// solo pagamenti effettivamente incassati (status Pagato) — amount già include la marca da bollo
const projPaid=pid=>S.payments.filter(p=>p.projectId===pid&&p.status==="Pagato").reduce((s,p)=>s+Number(p.amount),0);
// pagamenti in attesa/da emettere per un progetto — amount già include eventuale bollo
const projPending=pid=>S.payments.filter(p=>p.projectId===pid&&p.status!=="Pagato").reduce((s,p)=>s+Number(p.amount),0);
// conteggio bollo su tutti i pagamenti di un progetto (per mostrarlo nel totale)
const projBolloCount=pid=>S.payments.filter(p=>p.projectId===pid&&p.marcaBollo).length;
// all payments for a client (across all projects) — solo incassati, bollo incluso
const clientPaid=cid=>S.payments.filter(p=>p.clientId===cid&&p.status==="Pagato").reduce((s,p)=>s+Number(p.amount),0);
// total budgeted across client projects
const clientBudget=cid=>S.projects.filter(p=>p.clientId===cid).reduce((s,p)=>s+Number(p.amount||0),0);

function projPayState(pid,amount){
  const p=projPaid(pid);
  if(p<=0)return"Non pagato";
  if(p>=Number(amount||0))return"Pagato";
  return"Parziale";
}
// "Per me" sempre in fondo (ordine stabile per le altre voci)
const isPerMe=n=>String(n||"").trim().toLowerCase()==="per me";
function orderSplits(arr,nameOf=x=>x[0]){return[...arr.filter(x=>!isPerMe(nameOf(x))),...arr.filter(x=>isPerMe(nameOf(x)))];}
// entries [[nome,%]] → [{k,pct,eur}] ; con cinq: ogni voce arrotondata per difetto a 5€, gli esuberi vanno all'ultima voce
function calcSplits(entries,base,cinq){
  const list=orderSplits(entries.map(([k,v])=>[k,Number(v)||0]));
  let rem=0;
  return list.map(([k,pct],i)=>{
    const raw=base*pct/100;
    if(!cinq||!base)return{k,pct,eur:raw};
    const rounded=Math.floor(raw/5)*5;rem+=raw-rounded;
    return{k,pct,eur:i===list.length-1?rounded+rem:rounded};
  });
}
// ripartizione di un progetto {mode,cinq,rows:[{name,value}]} → percentuali [[nome,%]]
function defPctEntries(def){
  const rows=(def?.rows||[]).filter(r=>r.name);
  if(def?.mode==="pct")return rows.map(r=>[r.name,Number(r.value)||0]);
  const tot=rows.reduce((s,r)=>s+(Number(r.value)||0),0);
  return tot>0?rows.map(r=>[r.name,(Number(r.value)||0)/tot*100]):[];
}
// ripartizione (in €) mostrata per un progetto, calcolata sul suo totale
function projSplitRows(proj){
  const amt=Number(proj.amount)||0,sp=proj.splits;
  if(sp?.rows?.length){
    if(sp.mode==="eur")return orderSplits(sp.rows.map(r=>({k:r.name,eur:Number(r.value)||0})),x=>x.k);
    return calcSplits(defPctEntries(sp),amt,sp.cinq);
  }
  return[]; // nessuna ripartizione: si imposta a mano in ogni progetto
}
// ─── IMPONIBILE / INPS / RESIDUO PROGETTO ─────────────────────────────────────
const INPS_RATE=0.04, r2=n=>Math.round((Number(n)||0)*100)/100;
// imponibile del progetto: totale senza rivalsa INPS (la marca da bollo non fa parte del progetto)
const projNet=pr=>pr?r2(pr.rivalsaINPS?Number(pr.amount||0)/(1+INPS_RATE):Number(pr.amount||0)):0;
// imponibile di un pagamento (importo senza INPS e senza bollo); per i vecchi pagamenti l'INPS era già nell'importo digitato
function payNet(p){
  if(p.imponibile!==undefined)return Number(p.imponibile)||0;
  const pr=p.projectId?S.projects.find(x=>x.id===p.projectId):null;
  const b=Number(p.amountBase??p.amount)||0;
  return r2(pr?.rivalsaINPS?b/(1+INPS_RATE):b);
}
// imponibile già registrato nei pagamenti del progetto (escluso un pagamento in modifica)
const projRegistered=(pid,exceptId)=>r2(S.payments.filter(p=>p.projectId===pid&&p.id!==exceptId).reduce((s,p)=>s+payNet(p),0));
const projResidual=(proj,exceptId)=>r2(projNet(proj)-projRegistered(proj.id,exceptId));
// ripartizione effettiva (in €) di un pagamento: la sua, altrimenti quella del progetto, altrimenti il default
function paySplits(p){
  const base=Number(p.amountBase??p.amount)||0;
  if(p.customSplits){
    const e=Object.entries(p.customSplits);
    if((p.customSplitsMode||"eur")==="pct")return calcSplits(e,base,p.customSplitsCinq);
    return orderSplits(e.map(([k,v])=>({k,eur:Number(v)||0})),x=>x.k);
  }
  const proj=p.projectId?S.projects.find(x=>x.id===p.projectId):null;
  if(proj?.splits){const e=defPctEntries(proj.splits);if(e.length)return calcSplits(e,base,proj.splits.cinq);}
  return[]; // le % delle Impostazioni sono solo un promemoria, non contano
}

function sBadge(stage,map){
  map=map||SC;const c=map[stage]||"#64748b";
  return`<span class="badge" style="background:${c}20;color:${c};border:1px solid ${c}40"><span class="badge-dot" style="background:${c}"></span>${stage}</span>`;
}
function pBadge(ps){const c=PC[ps]||"#64748b";return`<span class="badge" style="background:${c}20;color:${c};border:1px solid ${c}40">${ps}</span>`;}

// ─── ICONS ────────────────────────────────────────────────────────────────────
const IC={
  dashboard:`<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>`,
  clients:`<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>`,
  finance:`<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
  settings:`<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>`,
  mic:`<svg width="16" height="16" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`,
  back:`<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>`,
  plus:`<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>`,
  alert:`<svg width="18" height="18" fill="none" stroke="#ef4444" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>`,
  dl:`<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>`,
  ul:`<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>`,
  folder:`<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>`,
  chevron:`<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>`,
};

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  document.body.className=S.dark?"":"light";
  const nav=["dashboard","clients","finance","settings"];
  const NL=["Dashboard","Clienti","Finanze","Impostazioni"];
  const cur=S.page==="client"?"clients":S.page;

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function pgDash(){
  const act=S.clients.filter(c=>!c.archived);
  const sc=STAGES.reduce((a,s)=>({...a,[s]:act.filter(c=>c.stage===s).length}),{});
  // incassato = solo pagamenti con status Pagato
  const inc=S.payments.filter(p=>p.status==="Pagato").reduce((s,p)=>s+Number(p.amount),0);
  // in attesa = pagamenti registrati ma non ancora Pagato
  const attPays=S.payments.filter(p=>p.status!=="Pagato").reduce((s,p)=>s+Number(p.amount),0);
  // potenziale = budget totale progetti attivi non ancora completamente incassato
  const activeProjs=S.projects.filter(p=>!p.archived);
  const pot=activeProjs.reduce((s,p)=>s+Number(p.amount||0),0);
  const al=act.filter(c=>c.stage!=="Completato"&&daysSince(c.updatedAt)>=S.settings.alertDays);
  return`<div class="space-y-4">
  <div class="grid3">
    ${[{l:"Incassato",v:fmt(inc),c:"var(--green)"},{l:"Pagamenti in attesa",v:fmt(attPays),c:"var(--yellow)"},{l:"Potenziale totale",v:fmt(pot),c:"var(--accent)"}].map(k=>`
    <div class="card" style="border-color:${k.c}40"><div class="sec-label">${k.l}</div><div class="text-2xl font-black" style="color:${k.c}">${k.v}</div></div>`).join("")}
  </div>

  <div class="grid5">${STAGES.map(s=>`<div class="pipeline-col" style="background:${SC[s]}18;border:1px solid ${SC[s]}30"><div class="text-2xl font-black" style="color:${SC[s]}">${sc[s]||0}</div><div class="text-xs muted mt1">${s}</div></div>`).join("")}</div></div>
  ${al.length?`<div class="card" style="background:#ef444410;border-color:#ef444430">
  <div class="flex items-center gap2 mb3">${IC.alert}<span class="font-bold text-sm" style="color:#ef4444">Follow-up richiesto (${al.length})</span></div>
  <div class="space-y-2">${al.map(c=>`<div class="flex items-center justify-between card-sm" style="cursor:pointer" onclick="openC('${c.id}')"><span class="font-bold text-sm">${c.name}</span><div class="flex items-center gap2">${sBadge(c.stage)}<span class="text-xs red">${daysSince(c.updatedAt)}g fa</span></div></div>`).join("")}</div></div>`:""}
  <div class="flex justify-between items-center">
    <span class="text-sm muted">${act.length} clienti · ${activeProjs.length} progetti attivi</span>
    <button class="btn btn-primary" onclick="openClientModal(null)">${IC.plus} Nuovo cliente</button>

}

    <button class="btn btn-danger btn-sm" ${_selArch.size?"":"disabled style='opacity:.4;pointer-events:none'"} onclick="delClients([..._selArch])">🗑 Elimina selezionati (${_selArch.size})</button>

  <div class="space-y-2">

              :`<button class="btn btn-ghost btn-sm" title="Ripristina" onclick="event.stopPropagation();unarchC('${c.id}')">↩️</button><button class="btn btn-danger btn-sm" title="Elimina" onclick="event.stopPropagation();delClients(['${c.id}'])">🗑</button>`}

function setF(s){_fs=s;render();}function setSR(v){_sr=v;render();}function toggleSA(){_sa=!_sa;_selArch.clear();render();}
function selArch(id,on){on?_selArch.add(id):_selArch.delete(id);render();}
function selAllArch(on){S.clients.filter(c=>c.archived).forEach(c=>on?_selArch.add(c.id):_selArch.delete(c.id));render();}
function archC(id){
  if(!confirm("Archiviare questo cliente? Rimarrà accessibile dalla sezione Archiviati."))return;
  S.clients=S.clients.map(c=>c.id===id?{...c,archived:true,updatedAt:today()}:c);
  S.events=[...S.events,{id:uid(),clientId:id,date:today(),text:"Cliente archiviato",type:"edit"}];
  if(S.page==="client"){S.page="clients";S.selClient=null;}
  save();render();
}
function unarchC(id){
  S.clients=S.clients.map(c=>c.id===id?{...c,archived:false,updatedAt:today()}:c);
  S.events=[...S.events,{id:uid(),clientId:id,date:today(),text:"Cliente ripristinato",type:"edit"}];
  _selArch.delete(id);
  if(S.page==="client")S.selClient=S.clients.find(c=>c.id===id);
  save();render();
}
// elimina definitivamente clienti (archiviati) insieme a progetti, pagamenti ed eventi collegati
function delClients(ids){
  const set=new Set(ids.filter(id=>S.clients.find(c=>c.id===id)?.archived));
  if(!set.size)return;
  const names=S.clients.filter(c=>set.has(c.id)).map(c=>c.name);
  const nP=S.projects.filter(p=>set.has(p.clientId)).length,nPay=S.payments.filter(p=>set.has(p.clientId)).length;
  if(!confirm(`Eliminare definitivamente ${set.size===1?`"${names[0]}"`:set.size+" clienti"}?\n\nVerranno eliminati anche ${nP} progetti e ${nPay} pagamenti collegati.\nL'operazione è IRREVERSIBILE.`))return;
  S.clients=S.clients.filter(c=>!set.has(c.id));
  S.projects=S.projects.filter(p=>!set.has(p.clientId));
  S.payments=S.payments.filter(p=>!set.has(p.clientId));
  S.events=S.events.filter(e=>!set.has(e.clientId));
  set.forEach(id=>_selArch.delete(id));
  if(S.page==="client"){S.page="clients";S.selClient=null;}
  save();render();
}

function projSection(key,label,list,card){
  if(!list.length)return"";
  const open=!!S.openSections[key];
  return`<div class="mt3" style="border-top:1px solid var(--border);padding-top:8px">
    <button onclick="toggleSection('${key}')" class="flex items-center gap2 text-xs muted w-full" style="padding:8px 0;font-weight:700;text-align:left">
      <span class="chevron${open?" open":""}">${IC.chevron}</span>${label} (${list.length})
    </button>
    ${open?`<div style="margin-top:6px">${list.map(p=>card(p)).join("")}</div>`:""}
  </div>`;
}
function toggleSection(k){S.openSections[k]=!S.openSections[k];render();}
function toggleProj(pid){S.openProjects[pid]=!S.openProjects[pid];render();}
function chStage(cid,stage){
  S.clients=S.clients.map(c=>c.id===cid?{...c,stage,updatedAt:today()}:c);
  S.events=[...S.events,{id:uid(),clientId:cid,date:today(),text:`Fase cliente → ${stage}`,type:"stage"}];
  S.selClient=S.clients.find(c=>c.id===cid);save();render();
}
function chProjStage(pid,stage){
  const proj=S.projects.find(p=>p.id===pid);if(!proj)return;
  S.projects=S.projects.map(p=>p.id===pid?{...p,stage}:p);
  S.events=[...S.events,{id:uid(),clientId:proj.clientId,date:today(),text:`Progetto "${proj.name}" → ${stage}`,type:"stage"}];
  S.selClient=S.clients.find(c=>c.id===proj.clientId);save();render();
}
function toggleMateriale(pid){
  S.projects=S.projects.map(p=>p.id===pid?{...p,materialeRicevuto:!p.materialeRicevuto}:p);
  S.selClient=S.selClient?S.clients.find(cl=>cl.id===S.selClient.id):null;
  save();render();
}
function delProj(pid,clientId){
  const proj=S.projects.find(p=>p.id===pid);if(!proj)return;
  if(!confirm(`Eliminare definitivamente il progetto "${proj.name}"?\nI pagamenti associati NON verranno eliminati.`))return;
  S.projects=S.projects.filter(p=>p.id!==pid);
  S.events=[...S.events,{id:uid(),clientId,date:today(),text:`Progetto "${proj.name}" eliminato`,type:"edit"}];
  S.selClient=S.clients.find(c=>c.id===clientId);
  save();render();
}
function archProj(pid){
  const proj=S.projects.find(p=>p.id===pid);if(!proj)return;
  if(!confirm(`Archiviare il progetto "${proj.name}"?`))return;
  S.projects=S.projects.map(p=>p.id===pid?{...p,archived:true}:p);
  save();render();
}
function addNote(cid){
  const inp=document.getElementById("nni");if(!inp||!inp.value.trim())return;
  S.events=[...S.events,{id:uid(),clientId:cid,date:today(),text:inp.value.trim(),type:"note"}];
  S.clients=S.clients.map(c=>c.id===cid?{...c,updatedAt:today()}:c);
  S.selClient=S.clients.find(c=>c.id===cid);save();render();
}
function delPay(pid,cid){
  if(!confirm("Eliminare questo pagamento? L'operazione non è reversibile."))return;
  S.payments=S.payments.filter(p=>p.id!==pid);
  S.events=[...S.events,{id:uid(),clientId:cid,date:today(),text:"Pagamento eliminato",type:"edit"}];
  S.selClient=S.clients.find(c=>c.id===cid);save();render();
}

// ─── FINANCE ─────────────────────────────────────────────────────────────────
let _fv="mensile";
function pgFinance(){

  const tot=paid.reduce((s,p)=>s+Number(p.amount),0);

  const st={};
  paid.forEach(p=>{paySplits(p).forEach(r=>{st[r.k]=(st[r.k]||0)+r.eur;});});
  const bolloTot=paid.reduce((s,p)=>s+(p.marcaBollo?2:0),0);
  const bM=S.payments.reduce((a,p)=>{const k=p.date?.slice(0,7)||"N/A";if(!a[k])a[k]=[];a[k].push(p);return a},{});

  return`<div class="space-y-4">
  <div class="card">
    <div class="grid2 mb3">
      <div><div class="sec-label">Totale incassato</div><div class="text-3xl font-black green">${fmt(tot)}</div></div>

    ${bolloTot>0?`<div class="split-row"><span class="muted">Marche da bollo</span><span class="font-bold">${fmt(bolloTot)}</span></div>`:""}
  </div>
  <div class="flex items-center justify-between">
    <div class="flex gap2">${["mensile","annuale"].map(m=>`<button class="pill${_fv===m?" active":""}" onclick="setFV('${m}')">${m}</button>`).join("")}</div>
    <button class="btn btn-primary btn-sm" onclick="openPayModal(null,null)">${IC.plus} Registra</button>
  </div>
  ${_fv==="mensile"?`<div class="space-y-3">
    ${Object.keys(bM).length===0?`<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">Nessun pagamento.</div>`:""}
    ${Object.entries(bM).sort((a,b)=>b[0].localeCompare(a[0])).map(([mo,ps])=>`
    <div class="card" style="padding:0;overflow:hidden">
      <div class="flex justify-between items-center" style="padding:12px 16px;border-bottom:1px solid var(--border)">
        <span class="font-bold text-sm">${mo}</span><span class="font-black green">${fmt(ps.reduce((s,p)=>s+Number(p.amount),0))}</span>
      </div>
      ${ps.map(p=>{
        const cl=S.clients.find(c=>c.id===p.clientId);
        const proj=p.projectId?S.projects.find(pr=>pr.id===p.projectId):null;
        const sc2=PAY_STATUS_C[p.status]||"#10b981";
        return`<div class="flex justify-between items-center" style="padding:10px 16px;border-bottom:1px solid var(--border)">
          <div>
            <div class="text-sm font-bold">${cl?.name||"—"}</div>
            <div class="text-xs muted">${proj?`📁 ${proj.name} · `:""}${p.note||""} · ${fmtD(p.date)}</div>
          </div>
          <div class="flex items-center gap2">
            <span class="badge" style="background:${sc2}20;color:${sc2};border:1px solid ${sc2}40;font-size:10px">${p.status||"Pagato"}</span>
            <span class="font-bold text-sm" style="color:${sc2}">${fmt(Number(p.amount))}</span>
          </div>
        </div>`;}).join("")}
    </div>`).join("")}
  </div>`:`<div class="card" style="padding:0;overflow:hidden">
    ${Object.entries(bY).sort((a,b)=>b[0].localeCompare(a[0])).map(([y,t])=>`
    <div class="flex justify-between items-center" style="padding:14px 16px;border-bottom:1px solid var(--border)">
      <span class="font-bold">${y}</span><span class="font-black text-lg green">${fmt(t)}</span>
    </div>`).join("")}

function setFV(v){_fv=v;render();}

  </div>
  <button class="btn btn-primary" onclick="saveSettings()">✓ Salva impostazioni</button>
  <div class="card">
    <div class="font-bold mb1">💾 Backup & Ripristino</div>

    <div class="flex gap2" style="flex-wrap:wrap">
      <button class="btn btn-green" onclick="doExport()">${IC.dl} Esporta backup</button>
      <button class="btn btn-ghost" onclick="document.getElementById('imp-f').click()">${IC.ul} Importa backup</button>
      <input type="file" id="imp-f" accept=".json" style="display:none" onchange="doImport(this)"/>
    </div>

  <div class="card">

    <div class="field"><label>Token GitHub</label><input id="gh-token" type="password" autocomplete="off" placeholder="ghp_… / github_pat_…" value="${SYNC.token||""}" onchange="saveSync()"/></div>

  <div class="card" style="border-color:#ef444440">

function stepSplit(k,d){S.settings.splits[k]=clamp(Number(S.settings.splits[k]||0)+d,0,100);save();render();}
function updSplit(k,v){S.settings.splits[k]=clamp(Number(v),0,100);save();updateSplitTot();}
function updateSplitTot(){const t=Object.values(S.settings.splits).reduce((a,v)=>a+Number(v),0);const el=document.getElementById("split-tot");if(el){el.textContent=t+"%";el.style.color=t!==100?"#ef4444":"#10b981";}}
function renSplit(ok,nk){if(!nk||nk===ok)return;const ns={};Object.entries(S.settings.splits).forEach(([k,v])=>{ns[k===ok?nk:k]=v;});S.settings.splits=Object.fromEntries(orderSplits(Object.entries(ns)));save();render();}
function remSplit(k){delete S.settings.splits[k];save();render();}
function addSplit(){const k=document.getElementById("ns-k")?.value.trim();const v=document.getElementById("ns-v")?.value;if(k&&v){S.settings.splits[k]=clamp(Number(v),0,100);S.settings.splits=Object.fromEntries(orderSplits(Object.entries(S.settings.splits)));save();render();}}
function saveSettings(){
  S.settings.businessName=document.getElementById("s-name")?.value||"NikyCRM";
  S.settings.alertDays=Number(document.getElementById("s-days")?.value)||7;
  document.querySelectorAll("#splits-list [data-key]").forEach(r=>{const k=r.dataset.key;const i=r.querySelector(".snv");if(i)S.settings.splits[k]=clamp(Number(i.value),0,100);});
  save();render();showMsg("bk-msg","✓ Salvato","#10b981");
}
function buildData(){return{clients:S.clients,events:S.events,payments:S.payments,projects:S.projects,settings:S.settings,exportedAt:new Date().toISOString()};}
function applyData(d){
  S.clients=d.clients||[];S.events=d.events||[];S.payments=d.payments||[];
  S.projects=d.projects||[];if(d.settings)S.settings=d.settings;normSettings();
  save();render();
}
function doExport(){
  const d=buildData();
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));
  a.download=`niky-crm-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);
}
function doImport(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{
    try{const d=JSON.parse(e.target.result);
      if(!d.clients)throw 0;
      const ts=d.exportedAt?new Date(d.exportedAt).toLocaleString("it-IT"):"data sconosciuta";
      if(!confirm(`Importare backup del ${ts}?\nSovrascrive TUTTI i dati attuali.`))return;
      applyData(d);showMsg("bk-msg","✓ Importato!","#10b981");
    }catch{showMsg("bk-msg","✗ File non valido","#ef4444");}
  };r.readAsText(f);inp.value="";
}
// ─── SYNC GITHUB ──────────────────────────────────────────────────────────────
function saveSync(show){
  SYNC.token=(document.getElementById("gh-token")?.value||"").trim();
  // accetta anche l'URL completo del gist: l'ID è l'ultimo pezzo
  SYNC.gist=(document.getElementById("gh-gist")?.value||"").trim().replace(/[?#].*$/,"").replace(/\/$/,"").split("/").pop();
  const g=document.getElementById("gh-gist");if(g)g.value=SYNC.gist;
  LS.set("crm_sync",SYNC);
  if(show===true)showMsg("gh-msg","✓ Salvato","#10b981");
}
const GH_FILE="nikycrm-data.json";
const b64dec=str=>new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g,"")),c=>c.charCodeAt(0)));
async function ghApi(path,opt={}){
  const r=await fetch("https://api.github.com"+path,{...opt,headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+SYNC.token,...(opt.headers||{})}});
  if(r.status===401)throw new Error("Token non valido");
  if(r.status===403)throw new Error("Accesso negato (il token ha il permesso gist?)");
  return r;
}
function ghCheck(){
  saveSync();
  if(!SYNC.token){showMsg("gh-msg","✗ Inserisci il token","#ef4444");return false;}
  return true;
}
async function ghCreateGist(){
  const r=await ghApi("/gists",{method:"POST",body:JSON.stringify({description:"NikyCRM dati",public:false,files:{[GH_FILE]:{content:JSON.stringify(buildData(),null,2)}}})});
  if(!r.ok)throw new Error("Creazione gist fallita ("+r.status+")");
  SYNC.gist=(await r.json()).id;LS.set("crm_sync",SYNC);
  const g=document.getElementById("gh-gist");if(g)g.value=SYNC.gist;
  return SYNC.gist;
}
async function ghPush(){
  if(!ghCheck())return;
  showMsg("gh-msg","… push in corso","var(--muted)",60000);
  try{
    if(SYNC.gist){
      const r=await ghApi("/gists/"+SYNC.gist,{method:"PATCH",body:JSON.stringify({files:{[GH_FILE]:{content:JSON.stringify(buildData(),null,2)}}})});
      if(r.ok){showMsg("gh-msg","✓ Push completato","#10b981");return;}
      if(r.status!==404)throw new Error("Push fallito ("+r.status+")");
      const old=SYNC.gist;const id=await ghCreateGist();
      showMsg("gh-msg",`✓ Gist ${old.slice(0,8)}… non trovato: creato nuovo gist ${id}`,"#10b981",9000);return;
    }
    const id=await ghCreateGist();
    showMsg("gh-msg",`✓ Creato nuovo gist ${id} e push completato`,"#10b981",9000);
  }catch(e){showMsg("gh-msg","✗ "+e.message,"#ef4444");}
}
async function ghPull(){
  if(!ghCheck())return;
  if(!SYNC.gist){showMsg("gh-msg","✗ Inserisci l'ID del gist (o fai prima un Push)","#ef4444");return;}
  showMsg("gh-msg","… pull in corso","var(--muted)",60000);
  try{
    const r=await ghApi("/gists/"+SYNC.gist);
    if(r.status===404)throw new Error("Gist non trovato");
    if(!r.ok)throw new Error("Pull fallito ("+r.status+")");
    const f=(await r.json()).files?.[GH_FILE];
    if(!f)throw new Error(`Nel gist manca il file ${GH_FILE}`);
    let txt=f.content;
    if(f.truncated||txt===undefined){const raw=await fetch(f.raw_url);txt=await raw.text();}
    const d=JSON.parse(txt);
    if(!d.clients)throw new Error("File non valido");
    const ts=d.exportedAt?new Date(d.exportedAt).toLocaleString("it-IT"):"data sconosciuta";
    if(!confirm(`Scaricare i dati del ${ts}?\nSovrascrive TUTTI i dati di questo dispositivo.`)){showMsg("gh-msg","Pull annullato","var(--muted)");return;}
    applyData(d);
    showMsg("gh-msg","✓ Pull completato","#10b981");
  }catch(e){showMsg("gh-msg","✗ "+e.message,"#ef4444");}
}

  if(!confirm("Ultima conferma: cancellare tutto?"))return;

function calcProjTotal(){
  const sv=document.getElementById("pj-sv")?.value||"";
  const inps=document.getElementById("pj-inps")?.checked||false;
  let subtotal=0;
  let rows=[];

  if(sv==="Montaggio Podcast"){
    const np=Number(document.getElementById("pj-np")?.value||0);
    const pp=Number(document.getElementById("pj-pp")?.value||0);
    const trailer=document.getElementById("pj-tr")?.value==="si";
    const ptr=trailer?Number(document.getElementById("pj-ptr")?.value||0):0;
    const pdis=Number(document.getElementById("pj-pdis")?.value||0);
    const basePuntate=np*pp;
    subtotal=basePuntate+ptr+pdis;
    if(np&&pp) rows.push(`${np} puntate × ${fmt(pp)} = <strong>${fmt(basePuntate)}</strong>`);
    if(ptr>0)  rows.push(`Trailer: <strong>${fmt(ptr)}</strong>`);
    if(pdis>0) rows.push(`Distribuzione: <strong>${fmt(pdis)}</strong>`);
  } else {
    const fp=Number(document.getElementById("pj-free-price")?.value||0);
    subtotal=fp;
    if(fp>0) rows.push(`Prezzo base: <strong>${fmt(fp)}</strong>`);
  }

  const inpsAmt=inps?subtotal*0.04:0;
  subtotal+=inpsAmt;
  if(inpsAmt>0) rows.push(`Rivalsa INPS 4%: <strong>${fmt(inpsAmt)}</strong>`);
  const total=subtotal;

  const bd=document.getElementById("pj-breakdown");
  if(bd) bd.innerHTML=rows.length?rows.join("<br/>"):`<span style="color:var(--muted)">Compila i campi per vedere il calcolo</span>`;
  const te=document.getElementById("pj-total");
  if(te) te.textContent=fmt(total);
  const ae=document.getElementById("pj-a");
  if(ae&&total>0) ae.value=total.toFixed(2);
}

// ─── SPLIT EDITOR (condiviso da progetto e pagamento) ─────────────────────────
// Stato per editor: {on,mode:"pct"|"eur",rows:[{id,name,value}],cinq,focus,areaId,title,offNote,getAmt,seed,offHtml}
const SPE={};
function speInit(key,cfg){SPE[key]={on:false,mode:"pct",rows:[],cinq:false,focus:null,...cfg};}
function speAmt(e){return Number(e.getAmt())||0;}
function speRender(key){
  const e=SPE[key];if(!e)return;
  const area=document.getElementById(e.areaId);if(!area)return;
  const amt=speAmt(e);
  const head=e.noToggle?"":`<div class="toggle-wrap" onclick="speToggle('${key}')">
      <div class="toggle${e.on?" on":""}"></div>
      <div><div class="font-bold text-sm">${e.title}</div>
      <div class="text-xs muted">${e.offNote}</div></div>
    </div>`;
  if(!e.on){
    area.innerHTML=`<div class="card-sm mb3" style="background:var(--bg)">${head}${e.offHtml?`<div class="mt3">${e.offHtml()}</div>`:""}</div>`;
    return;
  }
  e.rows=orderSplits(e.rows,r=>r.name); // "Per me" sempre in fondo
  const unit=e.mode==="pct"?"%":"€";
  const step=e.mode==="pct"?5:10;
  const tot=e.rows.reduce((s,r)=>s+Number(r.value||0),0);
  const diff=e.mode==="eur"?amt-tot:null;
  const ok=e.mode==="pct"?Math.abs(tot-100)<0.01:Math.abs(diff)<0.01;
  const stColor=ok?"#10b981":"#ef4444";
  const disp=e.mode==="pct"?calcSplits(e.rows.map(r=>[r.name,r.value]),amt,e.cinq).map(r=>r.eur):[];
  const cinqSwitch=e.mode==="pct"?`<div class="toggle-wrap mb3" style="gap:8px" onclick="speCinq('${key}')">
      <div class="toggle${e.cinq?" on":""}" style="flex-shrink:0"></div>
      <div class="text-sm"><strong>Arrotonda alla cinquina</strong><br/><span class="muted" style="font-size:11px">Esuberi di ogni voce → all'ultima</span></div>
    </div>`:"";
  const rows=e.rows.map((r,i)=>`
      <div class="mb3" style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px">
        <div class="flex items-center gap2 mb2">
          <input type="text" value="${(r.name||"").replace(/"/g,"&quot;")}" placeholder="Nome voce..."
            style="flex:1;font-size:13px;padding:6px 10px;min-width:0"
            oninput="speName('${key}','${r.id}',this.value)"/>
          <button class="stepper-btn" type="button" onclick="speDel('${key}','${r.id}')" style="color:#ef4444;flex-shrink:0">✕</button>
        </div>
        <div class="flex items-center gap2">
          <button class="stepper-btn" type="button" onclick="speStep('${key}','${r.id}',-${step})">−</button>
          <input type="number" id="sv-${key}-${r.id}" value="${e.mode==="pct"?(+r.value).toFixed(1):(+r.value).toFixed(2)}"
            style="flex:1;text-align:center;min-width:0${e.focus===r.id?";border-color:var(--accent)":""}"
            onfocus="speFocus('${key}','${r.id}')" oninput="speVal('${key}','${r.id}',this.value)"/>
          <button class="stepper-btn" type="button" onclick="speStep('${key}','${r.id}',${step})">+</button>
          <span class="muted text-sm" style="flex-shrink:0">${unit}</span>
          ${e.mode==="pct"?`<span id="sdv-${key}-${r.id}" class="text-sm accent font-bold" style="flex-shrink:0">${fmt(disp[i])}</span>`:""}
        </div>
      </div>`).join("");
  area.innerHTML=`<div class="card-sm mb3" style="background:var(--bg)">
      ${head}
      <div class="flex gap2 ${e.noToggle?"":"mt3 "}mb3">
        <button class="btn btn-sm ${e.mode==="pct"?"btn-primary":"btn-ghost"}" type="button" onclick="speMode('${key}','pct')">% Percentuale</button>
        <button class="btn btn-sm ${e.mode==="eur"?"btn-primary":"btn-ghost"}" type="button" onclick="speMode('${key}','eur')">€ Importo fisso</button>
      </div>
      <div class="sec-label">Ripartizione — ${unit} personalizzata</div>
      ${cinqSwitch}
      ${rows}
      <button class="btn btn-ghost btn-sm mt2 mb3" onclick="speAdd('${key}')" type="button">+ Aggiungi voce</button>
      <div class="split-row" id="stt-${key}" style="border-top:1px solid var(--border);padding-top:8px">${speTotals(e)}</div>
    </div>`;
}
function speTotals(e){
  const amt=speAmt(e),tot=e.rows.reduce((s,r)=>s+Number(r.value||0),0);
  const diff=amt-tot,ok=e.mode==="pct"?Math.abs(tot-100)<0.01:Math.abs(diff)<0.01,c=ok?"#10b981":"#ef4444";
  return e.mode==="pct"
    ?`<span class="font-bold">Totale %</span><span class="font-bold" style="color:${c}">${tot.toFixed(1)}%</span>`
    :`<span class="font-bold">Non assegnato</span><span class="font-bold" style="color:${c}">${fmt(diff)}</span>`;
}
// aggiorna importi e totali senza ridisegnare i campi (così i tap sui bottoni non si perdono)
function speRefresh(key){
  const e=SPE[key];if(e.mode==="pct"){
    const d=calcSplits(e.rows.map(r=>[r.name,r.value]),speAmt(e),e.cinq).map(r=>r.eur);
    e.rows.forEach((r,i)=>{const el=document.getElementById(`sdv-${key}-${r.id}`);if(el)el.textContent=fmt(d[i]);});
  }
  const t=document.getElementById("stt-"+key);if(t)t.innerHTML=speTotals(e);
}
function speToggle(key){
  const e=SPE[key];e.on=!e.on;
  if(e.on&&e.rows.length===0){ // parte dalla ripartizione ereditata, già modificabile
    e.mode="pct";e.cinq=false;
    e.rows=orderSplits(e.seed().map(([name,value])=>({id:uid(),name,value:Number(value)||0})),r=>r.name);
  }
  speRender(key);
}
function speCinq(key){const e=SPE[key];e.cinq=!e.cinq;speRender(key);}
function speMode(key,m){
  const e=SPE[key];if(e.mode===m)return;
  const a=speAmt(e);
  e.rows=e.rows.map(r=>({...r,value:m==="eur"?+(a*r.value/100).toFixed(2):(a>0?+(r.value/a*100).toFixed(2):0)}));
  e.mode=m;if(m==="eur")e.cinq=false;
  speRender(key);
}
function speAdd(key){const e=SPE[key];const r={id:uid(),name:"",value:0};e.rows.push(r);e.focus=r.id;speRender(key);}
function speDel(key,id){const e=SPE[key];e.rows=e.rows.filter(r=>r.id!==id);if(e.focus===id)e.focus=null;speRender(key);}
function speName(key,id,v){const r=SPE[key].rows.find(r=>r.id===id);if(r)r.name=v;}
function speFocus(key,id){SPE[key].focus=id;}
function speVal(key,id,v){const r=SPE[key].rows.find(r=>r.id===id);if(r)r.value=Math.max(0,Number(v)||0);speRefresh(key);}
function speStep(key,id,d){
  const e=SPE[key];const r=e.rows.find(r=>r.id===id);if(!r)return;
  r.value=e.mode==="pct"?Math.max(0,Math.min(100,(r.value||0)+d)):Math.max(0,(r.value||0)+d);
  e.focus=id;speRender(key);
}
// righe valide pronte per il salvataggio ("Per me" in fondo)
function speResult(key){
  const e=SPE[key];
  if(!e.on)return null;
  const rows=orderSplits(e.rows.filter(r=>r.name&&r.name.trim()),r=>r.name).map(r=>({name:r.name.trim(),value:Number(r.value)||0}));
  return rows.length?{mode:e.mode,cinq:e.mode==="pct"&&e.cinq,rows}:null;
}

// ─── CALCOLATRICE RAPIDA (si apre dal tastino) ────────────────────────────────
let _calcVal="0", _calcOp=null, _calcPrev=null, _calcJustOp=false;
window._calcApply=null;
function calcBlock(amtLabel){
  _calcVal="0";_calcOp=null;_calcPrev=null;_calcJustOp=false;
  const k=(label,key,extra="")=>`<button type="button" onclick="calcKey('${key}')" class="btn btn-ghost btn-sm" style="justify-content:center;font-size:15px;font-weight:700;padding:10px 0;${extra}">${label}</button>`;
  const op=(l,key)=>k(l,key,"color:var(--accent)");
  return`<div class="mb3">
    <button type="button" class="btn btn-ghost btn-sm" onclick="toggleCalc()" id="calc-btn">🧮 Calcolatrice rapida</button>
    <div id="calc-box" class="card-sm mt2" style="display:none;background:var(--bg)">
      <div class="sec-label mb2">🧮 Calcolatrice rapida</div>
      <div class="flex gap2 mb2"><input id="calc-display" type="text" value="0" readonly style="flex:1;text-align:right;font-size:18px;font-weight:700;color:var(--accent);background:var(--surface)"/></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
        ${k("7","7")}${k("8","8")}${k("9","9")}${op("÷","/")}
        ${k("4","4")}${k("5","5")}${k("6","6")}${op("×","*")}
        ${k("1","1")}${k("2","2")}${k("3","3")}${op("−","-")}
        ${k("0","0")}${k(".",".")}<button type="button" onclick="calcKey('=')" class="btn btn-primary btn-sm" style="justify-content:center;font-size:15px;font-weight:700;padding:10px 0">=</button>${op("+","+")}
        <button type="button" onclick="calcKey('C')" class="btn btn-danger btn-sm" style="justify-content:center;font-size:13px;font-weight:700;grid-column:1/3">C</button>
        <button type="button" onclick="calcKey('AMT')" class="btn btn-green btn-sm" style="justify-content:center;font-size:11px;font-weight:700;grid-column:3/5">→ ${amtLabel}</button>
      </div>
    </div>
  </div>`;
}
function toggleCalc(){
  const b=document.getElementById("calc-box");if(!b)return;
  b.style.display=b.style.display==="none"?"block":"none";
}
function calcKey(k){
  const d=document.getElementById("calc-display");if(!d)return;
  if(k==="C"){
    _calcVal="0";_calcOp=null;_calcPrev=null;_calcJustOp=false;
  } else if(k==="AMT"){
    if(window._calcApply)window._calcApply(parseFloat(_calcVal)||0);
    return;
  } else if(["+","-","*","/"].includes(k)){
    if(_calcOp!==null&&!_calcJustOp){
      const a=_calcPrev||0, b=parseFloat(_calcVal)||0;
      let r=a;
      if(_calcOp==="+")r=a+b;
      else if(_calcOp==="-")r=a-b;
      else if(_calcOp==="*")r=a*b;
      else if(_calcOp==="/")r=b!==0?a/b:0;
      _calcVal=String(Math.round(r*10000)/10000);
    }
    _calcPrev=parseFloat(_calcVal)||0;
    _calcOp=k;
    _calcJustOp=true;
  } else if(k==="="){
    if(_calcOp!==null&&_calcPrev!==null){
      const a=_calcPrev, b=parseFloat(_calcVal)||0;
      let r=a;
      if(_calcOp==="+")r=a+b;
      else if(_calcOp==="-")r=a-b;
      else if(_calcOp==="*")r=a*b;
      else if(_calcOp==="/")r=b!==0?a/b:0;
      _calcVal=String(Math.round(r*10000)/10000);
      _calcOp=null;_calcPrev=null;_calcJustOp=false;
    }
  } else if(k==="."){
    if(_calcJustOp){_calcVal="0.";_calcJustOp=false;}
    else if(!_calcVal.includes("."))_calcVal+=".";
  } else {
    if(_calcJustOp||_calcVal==="0"){_calcVal=k;_calcJustOp=false;}
    else _calcVal+=k;
  }
  if(d)d.value=_calcVal;
}

// ─── RIPARTIZIONE DEL PROGETTO ────────────────────────────────────────────────
function openProjSplitModal(pid){
  const proj=S.projects.find(p=>p.id===pid);if(!proj)return;
  const amount=Number(proj.amount)||0;
  speInit("proj",{
    areaId:"ps-area",title:"Ripartizione personalizzata",
    offNote:"",
    getAmt:()=>amount,
    noToggle:true,on:true,seed:()=>[]
  });
  const sp=proj.splits;
  if(sp&&sp.rows?.length){
    const e=SPE.proj;e.on=true;e.mode=sp.mode||"pct";e.cinq=!!sp.cinq;
    e.rows=sp.rows.map(r=>({id:uid(),name:r.name,value:Number(r.value)||0}));
  }
  window._calcApply=v=>{
    const e=SPE.proj;
    if(!e.on||!e.focus||!e.rows.find(r=>r.id===e.focus)){alert("Attiva la ripartizione personalizzata e tocca prima il campo della voce da compilare.");return;}
    const r=e.rows.find(r=>r.id===e.focus);r.value=Math.max(0,v);speRender("proj");
  };
  const ov=document.createElement("div");ov.className="modal-overlay";ov.id="mo";
  ov.onclick=e=>{if(e.target===ov)closeModal();};
  ov.innerHTML=`<div class="modal">
    <div class="modal-header"><span class="font-bold">Ripartizione progetto</span><button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="card-sm mb3" style="background:var(--bg)">
        <div class="text-sm font-bold">📁 ${proj.name||"Progetto"}</div>
        <div class="flex justify-between items-center mt2"><span class="text-xs upper muted">Totale progetto</span><span class="font-black" style="color:var(--accent)">${fmt(amount)}</span></div>
      </div>
      <div class="text-xs muted mb3">Ripartizione complessiva del progetto: la scrivi a mano, per ogni progetto. In ogni singolo pagamento puoi, se vuoi, impostarne una diversa.</div>
      ${calcBlock("Voce selezionata")}
      <div id="ps-area"></div>
      <div class="flex gap2 justify-between mt3">
        <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
        <button class="btn btn-primary" onclick="saveProjSplit('${pid}')">Salva ripartizione</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(ov);
  speRender("proj");
}
function saveProjSplit(pid){
  const proj=S.projects.find(p=>p.id===pid);if(!proj)return;
  const res=speResult("proj");
  S.projects=S.projects.map(p=>p.id===pid?{...p,splits:res}:p);
  S.events=[...S.events,{id:uid(),clientId:proj.clientId,date:today(),text:`Ripartizione progetto "${proj.name}" ${res?"personalizzata":"ripristinata al default"}`,type:"edit"}];
  S.selClient=S.clients.find(c=>c.id===proj.clientId)||S.selClient;
  save();closeModal();render();
}

// ─── PAYMENT MODAL ────────────────────────────────────────────────────────────
function openPayModal(preClientId, preProjectId, editPayId){
  const existing=editPayId?S.payments.find(p=>p.id===editPayId):null;
  window._payEditId=editPayId||null;
  const ac=S.clients.filter(c=>!c.archived);
  if(!ac.length){alert("Nessun cliente attivo.");return;}
  const effClientId=existing?.clientId||preClientId||ac[0]?.id;
  const effProjectId=existing?.projectId||preProjectId||null;

  speInit("pay",{
    areaId:"pay-split-area",title:"Ripartizione personalizzata (opzionale)",
    offNote:"Off = vale la ripartizione del progetto (se c'è)",
    getAmt:()=>payCalc().baseInps,
    seed:()=>{
      const proj=S.projects.find(p=>p.id===document.getElementById("pf-pr")?.value);
      const e=proj?.splits?defPctEntries(proj.splits):[];
      return e;
    }
  });
  if(existing?.customSplits){
    const e=SPE.pay;e.on=true;e.mode=existing.customSplitsMode||"eur";e.cinq=!!existing.customSplitsCinq;
    e.rows=Object.entries(existing.customSplits).map(([name,value])=>({id:uid(),name,value:Number(value)}));
  }
  window._calcApply=v=>{const ai=document.getElementById("pf-a");if(ai){ai.value=v;onPayChange();}};

  function projOpts(cid){
    const ps=S.projects.filter(p=>p.clientId===cid&&!p.archived);
    if(!ps.length)return`<option value="">— nessun progetto —</option>`;
    return`<option value="">— nessun progetto specifico —</option>`+
      ps.map(p=>`<option value="${p.id}"${p.id===effProjectId?" selected":""}>${p.name}</option>`).join("");
  }

  const ov=document.createElement("div");ov.className="modal-overlay";ov.id="mo";
  ov.onclick=e=>{if(e.target===ov)closeModal();};
  ov.innerHTML=`<div class="modal">
    <div class="modal-header">
      <span class="font-bold">${existing?"Modifica pagamento":"Registra pagamento"}</span>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Cliente</label>
        <select id="pf-cl" onchange="updateProjSelect()">${ac.map(c=>`<option value="${c.id}"${c.id===effClientId?" selected":""}>${c.name}</option>`).join("")}</select>
      </div>
      <div class="field"><label>Progetto (opzionale)</label>
        <select id="pf-pr" onchange="onPayChange()">${projOpts(effClientId)}</select>
      </div>
      <div class="grid2">
        <div class="field"><label>Importo base (€)</label>
          <input id="pf-a" type="number" step="0.01" placeholder="0" value="${existing?payNet(existing):""}" oninput="onPayChange()"/>
        </div>
        <div class="field"><label>Data</label>
          <input id="pf-d" type="date" value="${existing?.date||today()}"/>
        </div>
      </div>
      <div class="field"><label>Stato pagamento</label>
        <select id="pf-status" onchange="onPayChange()">
          ${PAY_STATUS.map(s=>`<option value="${s}"${(existing?.status||"Pagato")===s?" selected":""}>${s}</option>`).join("")}
        </select>
      </div>
      ${calcBlock("Importo")}
      <div class="field"><label>Nota</label>
        <input id="pf-no" placeholder="Es: acconto 50%, saldo finale..." value="${existing?.note||""}"/>
      </div>
      <label class="toggle-wrap mb3" style="gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px">
        <input type="checkbox" id="pf-bollo" ${existing?.marcaBollo?"checked":""} onchange="onPayChange()" style="width:auto;accent-color:var(--accent)"/>
        <div>
          <div class="font-bold text-sm">Marca da bollo €2,00</div>
          <div class="text-xs muted">Verrà aggiunta all'importo incassato</div>
        </div>
      </label>
      <div id="pay-split-area"></div>
      <div id="pay-total-area"></div>
      <div class="flex gap2 justify-between mt3">
        <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
        <button class="btn btn-primary" onclick="savePay('${existing?.id||""}')">
          ${existing?"Salva modifiche":"Registra pagamento"}
        </button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(ov);
  speRender("pay");
  onPayChange();
}

function updateProjSelect(){
  const cid=document.getElementById("pf-cl")?.value;
  const sel=document.getElementById("pf-pr");if(!sel)return;
  const ps=S.projects.filter(p=>p.clientId===cid&&!p.archived);
  sel.innerHTML=`<option value="">— nessun progetto specifico —</option>`+
    ps.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
  onPayChange();
}

// importi del pagamento in compilazione: base + INPS (se il progetto ha la rivalsa) + bollo
function payCalc(editId){
  const net=r2(document.getElementById("pf-a")?.value||0);
  const bollo=document.getElementById("pf-bollo")?.checked||false;
  const proj=S.projects.find(x=>x.id===document.getElementById("pf-pr")?.value)||null;
  const inps=proj?.rivalsaINPS?r2(net*INPS_RATE):0;
  const baseInps=r2(net+inps);
  const residual=proj&&proj.amount>0?projResidual(proj,editId||window._payEditId):null;
  return{net,inps,baseInps,bollo,total:r2(baseInps+(bollo?2:0)),proj,residual,over:residual!==null&&net>residual+0.005};
}

function onPayChange(){
  const c=payCalc();
  const status=document.getElementById("pf-status")?.value||"Pagato";
  const isPaid=status==="Pagato";
  const totalLabel=isPaid?"Totale incassato":"Totale previsto";
  const totalColor=isPaid?"var(--green)":"var(--yellow)";
  const tot=document.getElementById("pay-total-area");
  if(tot)tot.innerHTML=(c.net||c.residual!==null)?`<div class="card-sm mb3" style="background:var(--bg);${c.over?"border-color:#ef4444":""}">
      ${c.residual!==null?`<div class="split-row"><span class="muted">Residuo del progetto (base)</span><span class="font-bold" style="color:${c.over?"var(--red)":"var(--accent)"}">${fmt(c.residual)}</span></div>`:""}
      ${c.over?`<div class="text-xs red mb1">Importo oltre il residuo: non si può salvare.</div>`:""}
      ${c.net?`<div class="split-row"><span class="muted">Base</span><span class="font-bold">${fmt(c.net)}</span></div>`:""}
      ${c.inps?`<div class="split-row"><span class="muted">Rivalsa INPS 4%</span><span class="font-bold">+ ${fmt(c.inps)}</span></div>`:""}
      ${c.bollo?`<div class="split-row"><span class="muted">Marca da bollo</span><span class="font-bold">+ ${fmt(2)}</span></div>`:""}
      ${c.net?`<div class="split-row"><span class="font-bold">${totalLabel}</span><span class="font-black" style="color:${totalColor}">${fmt(c.total)}</span></div>`:""}
    </div>`:"";
  // gli importi per voce dipendono dall'importo
  if(SPE.pay?.on)speRender("pay");
}

function savePay(editId){
  const c=payCalc(editId);
  const amt=c.net,bollo=c.bollo,totalAmt=c.total;
  const status=document.getElementById("pf-status")?.value||"Pagato";
  const cid=document.getElementById("pf-cl")?.value;
  const projId=document.getElementById("pf-pr")?.value||null;
  const date=document.getElementById("pf-d")?.value||today();
  const note=document.getElementById("pf-no")?.value||"";
  if(!amt||!cid){alert("Inserisci cliente e importo.");return;}
  if(c.over){alert(`L'importo base (${fmt(amt)}) supera il residuo del progetto (${fmt(c.residual)}).`);return;}

  const pay={
    id:editId||uid(), clientId:cid, projectId:projId||null,
    amount:totalAmt, amountBase:c.baseInps, imponibile:amt, inps:c.inps, marcaBollo:bollo,
    status, date, note
  };
  const cs=speResult("pay");
  if(cs){
    // ripartizione facoltativa del singolo pagamento: {nome:valore} ("Per me" in fondo)
    pay.customSplits=Object.fromEntries(cs.rows.map(r=>[r.name,r.value]));
    pay.customSplitsMode=cs.mode;
    pay.customSplitsCinq=cs.cinq;
  }

  if(editId){
    S.payments=S.payments.map(p=>p.id===editId?pay:p);
  } else {
    S.payments=[...S.payments,pay];
  }

  S.clients=S.clients.map(c=>c.id===cid?{...c,updatedAt:today()}:c);
  const proj=projId?S.projects.find(p=>p.id===projId):null;
  const bolloNote=bollo?" +€2 bollo":"";
  const evtText=editId
    ?`Pagamento modificato: ${fmt(totalAmt)}${bolloNote} [${status}]${proj?` · ${proj.name}`:""}`
    :`Pagamento ${fmt(totalAmt)}${bolloNote} [${status}]${proj?` · ${proj.name}`:""} ${note?"· "+note:""}`;
  S.events=[...S.events,{id:uid(),clientId:cid,date,text:evtText,type:"payment"}];
  save();closeModal();
  if(S.selClient?.id===cid)S.selClient=S.clients.find(c=>c.id===cid);
  render();
}

  const sw=`const C="nikycrm-v4",F=["./","./index.html","./manifest.json","./icon-192.png","./icon-512.png"];
self.addEventListener("install",e=>e.waitUntil(caches.open(C).then(c=>c.addAll(F))));
self.addEventListener("fetch",e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"application/javascript"}))).catch(()=>{});
}
render();
</script>
